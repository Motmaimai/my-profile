  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <canvas id="snakeCanvas"></canvas>
    <div id="root"></div>

  <script>

    document.addEventListener('mousemove', (e) => {
        const body = document.body;
        // Lấy tọa độ chuột và gán vào biến CSS
        body.style.setProperty('--mouse-x', `${e.clientX}px`);
        body.style.setProperty('--mouse-y', `${e.clientY}px`);
    });
  </script>
  <script>
    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const gridSize = 20;
    let snake = [{x: 100, y: 100}, {x: 80, y: 100}, {x: 60, y: 100}];
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let food = { x: 200, y: 200 };

    // Trạng thái điều khiển
    let isManualMode = false;
    let manualTimeout;

    // 1. Lắng nghe sự kiện bàn phím
    window.addEventListener('keydown', (e) => {
      const key = e.key;
      let newDir = null;

      if (key === 'ArrowUp' && direction.y === 0) newDir = { x: 0, y: -1 };
      else if (key === 'ArrowDown' && direction.y === 0) newDir = { x: 0, y: 1 };
      else if (key === 'ArrowLeft' && direction.x === 0) newDir = { x: -1, y: 0 };
      else if (key === 'ArrowRight' && direction.x === 0) newDir = { x: 1, y: 0 };

      if (newDir) {
        nextDirection = newDir;
        isManualMode = true;
        
        // Nếu trong 3 giây không nhấn phím nào nữa, quay lại chạy ngẫu nhiên
        clearTimeout(manualTimeout);
        manualTimeout = setTimeout(() => {
          isManualMode = false;
        }, 3000); 
      }
    });

    function createFood() {
      food.x = Math.floor(Math.random() * (window.innerWidth / gridSize)) * gridSize;
      food.y = Math.floor(Math.random() * (window.innerHeight / gridSize)) * gridSize;
    }

    function update() {
      // 2. Chỉ đổi hướng ngẫu nhiên nếu KHÔNG ở chế độ thủ công
      if (!isManualMode) {
        if (Math.random() < 0.08) {
          const dirs = [{x: 1, y: 0}, {x: -1, y: 0}, {x: 0, y: 1}, {x: 0, y: -1}];
          const randomDir = dirs[Math.floor(Math.random() * dirs.length)];
          if (randomDir.x !== -direction.x && randomDir.y !== -direction.y) {
            nextDirection = randomDir;
          }
        }
      }

      direction = nextDirection;
      const head = { 
        x: snake[0].x + direction.x * gridSize, 
        y: snake[0].y + direction.y * gridSize 
      };

      // Xuyên tường
      if (head.x >= canvas.width) head.x = 0;
      if (head.x < 0) head.x = Math.floor(canvas.width / gridSize) * gridSize;
      if (head.y >= canvas.height) head.y = 0;
      if (head.y < 0) head.y = Math.floor(canvas.height / gridSize) * gridSize;

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        createFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Vẽ mồi
      ctx.fillStyle = '#22c55e';
      ctx.shadowBlur = 15;
      ctx.beginPath();
      ctx.arc(food.x + gridSize/2, food.y + gridSize/2, gridSize/3, 0, Math.PI * 2);
      ctx.fill();

      // Vẽ rắn
      snake.forEach((part, index) => {
        // Đổi màu đầu rắn khi ở chế độ thủ công để người dùng biết mình đang điều khiển
        ctx.fillStyle = index === 0 
          ? (isManualMode ? '#ff4757' : '#7b79ff') 
          : 'rgba(95, 92, 240, 0.4)';
        
        ctx.shadowBlur = isManualMode && index === 0 ? 25 : 10;
        ctx.shadowColor = isManualMode && index === 0 ? '#ff4757' : '#5f5cf0';
        
        ctx.beginPath();
        ctx.roundRect(part.x, part.y, gridSize - 2, gridSize - 2, 4);
        ctx.fill();
      });
    }

    function loop() {
      update();
      draw();
      setTimeout(loop, 90);
    }

    loop();
  </script>
